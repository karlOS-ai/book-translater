<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vokabel-Übersetzer</title>
<meta name="description" content="Englische Wörter übersetzen, automatisch speichern und mit Karteikarten wiederholen.">
<style>
/* Layout: iOS-style one-screen app. Each tab is a scrolling view, a translucent tab bar is fixed to the bottom,
   sheets slide up from the bottom like UIKit page sheets. Colors follow Apple's system palette. */
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --sheet: #F2F2F7;
  --sheet-card: #FFFFFF;
  --label: #000000;
  --label2: rgba(60, 60, 67, .6);
  --label3: rgba(60, 60, 67, .3);
  --sep: rgba(60, 60, 67, .22);
  --fill: rgba(120, 120, 128, .12);
  --fill2: rgba(120, 120, 128, .2);
  --seg-on: #FFFFFF;
  --knob: #FFFFFF;
  --accent: #007AFF;
  --accent-soft: rgba(0, 122, 255, .12);
  --on-accent: #FFFFFF;
  --green: #34C759;
  --green-soft: rgba(52, 199, 89, .14);
  --red: #FF3B30;
  --red-soft: rgba(255, 59, 48, .12);
  --orange: #FF9500;
  --orange-soft: rgba(255, 149, 0, .14);
  --tab-off: #8E8E93;
  --bar: rgba(249, 249, 249, .82);
  --bar-solid: #F9F9F9;
  --dim: rgba(0, 0, 0, .32);
  --hud: rgba(30, 30, 32, .9);
  --on-hud: #FFFFFF;
  --hl: rgba(0, 122, 255, .16);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 16px rgba(0, 0, 0, .04);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --serif: "New York", ui-serif, Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1C1C1E; --sheet: #1C1C1E; --sheet-card: #2C2C2E;
    --label: #FFFFFF; --label2: rgba(235, 235, 245, .6); --label3: rgba(235, 235, 245, .3);
    --sep: rgba(84, 84, 88, .6); --fill: rgba(118, 118, 128, .24); --fill2: rgba(118, 118, 128, .36);
    --seg-on: #636366; --knob: #FFFFFF;
    --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .2); --on-accent: #FFFFFF;
    --green: #30D158; --green-soft: rgba(48, 209, 88, .18); --red: #FF453A; --red-soft: rgba(255, 69, 58, .18);
    --orange: #FF9F0A; --orange-soft: rgba(255, 159, 10, .18);
    --tab-off: #8E8E93; --bar: rgba(22, 22, 24, .82); --bar-solid: #161618; --dim: rgba(0, 0, 0, .55);
    --hud: rgba(58, 58, 60, .94); --on-hud: #FFFFFF; --hl: rgba(10, 132, 255, .3);
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --sheet: #1C1C1E; --sheet-card: #2C2C2E;
  --label: #FFFFFF; --label2: rgba(235, 235, 245, .6); --label3: rgba(235, 235, 245, .3);
  --sep: rgba(84, 84, 88, .6); --fill: rgba(118, 118, 128, .24); --fill2: rgba(118, 118, 128, .36);
  --seg-on: #636366; --knob: #FFFFFF;
  --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .2); --on-accent: #FFFFFF;
  --green: #30D158; --green-soft: rgba(48, 209, 88, .18); --red: #FF453A; --red-soft: rgba(255, 69, 58, .18);
  --orange: #FF9F0A; --orange-soft: rgba(255, 159, 10, .18);
  --tab-off: #8E8E93; --bar: rgba(22, 22, 24, .82); --bar-solid: #161618; --dim: rgba(0, 0, 0, .55);
  --hud: rgba(58, 58, 60, .94); --on-hud: #FFFFFF; --hl: rgba(10, 132, 255, .3);
  --shadow: none;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--label);
  font: 17px/1.29 var(--font);
  letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
body.locked { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
.ic { width: 24px; height: 24px; display: block; flex: none; }
mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 2px; }
.ic-s { width: 18px; height: 18px; }
.ic-l { width: 30px; height: 30px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- views & navigation ---------- */
.view {
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px));
  min-height: 100%;
  box-sizing: border-box;
}
.nav-row { display: flex; align-items: center; justify-content: space-between; height: 44px; gap: 8px; }
.nav-btn { color: var(--accent); height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 17px; }
.nav-btn.right { margin-left: auto; }
.large-title { font: 700 34px/1.2 var(--font); letter-spacing: .01em; margin: 2px 0 4px; text-wrap: balance; }
.subtitle { color: var(--label2); font-size: 15px; margin: 0 0 16px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-top: 6px;
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--sep);
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--tab-off); font-size: 10px; font-weight: 500; letter-spacing: .01em; padding: 2px 0; position: relative; }
.tab .ic { width: 28px; height: 28px; }
.tab[aria-selected="true"] { color: var(--accent); }
.badge { position: absolute; top: -1px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: var(--red); color: var(--on-accent); font: 600 13px/18px var(--font); text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- translate tab ---------- */
.lang-bar { display: grid; grid-template-columns: 1fr 44px 1fr; align-items: center; gap: 6px; margin-top: 4px; }
.lang-btn { height: 44px; border-radius: 12px; background: var(--card); font-weight: 600; font-size: 16px; color: var(--label); box-shadow: var(--shadow); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
.swap-btn { width: 44px; height: 44px; border-radius: 22px; color: var(--accent); display: grid; place-items: center; transition: transform .35s cubic-bezier(.32, .72, 0, 1); }
.swap-btn.spin { transform: rotate(180deg); }

.tcard { background: var(--card); border-radius: 22px; margin-top: 12px; overflow: hidden; box-shadow: var(--shadow); }
.tc-sec { padding: 14px 18px 16px; }
.tc-src { min-height: 150px; display: flex; flex-direction: column; box-sizing: border-box; }
.tcard.has-out .tc-src { min-height: 0; }
.tc-lang { display: flex; align-items: center; gap: 6px; min-height: 28px; font-size: 14px; font-weight: 600; color: var(--label2); }
.tc-lang .grow { flex: 1; }
.tc-lang.accent { color: var(--accent); }
.mini-btn { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; color: var(--label2); }
.mini-btn.accent { color: var(--accent); }
.mini-btn .ic { width: 20px; height: 20px; }
#src { display: block; width: 100%; border: 0; outline: 0; background: transparent; resize: none; padding: 0; margin: 2px 0 0; font: 600 26px/1.22 var(--font); letter-spacing: -.02em; color: var(--label); caret-color: var(--accent); min-height: 34px; overflow: hidden; }
#src::placeholder { color: var(--label3); }
.tc-tools { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--fill); color: var(--label); font-size: 15px; font-weight: 500; }
.pill .ic { width: 18px; height: 18px; color: var(--accent); }
.go-btn { margin-left: auto; width: 36px; height: 36px; border-radius: 18px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.go-btn .ic { width: 22px; height: 22px; }
.tc-out { border-top: .5px solid var(--sep); }
.tc-trans { font: 600 26px/1.22 var(--font); letter-spacing: -.02em; color: var(--accent); overflow-wrap: anywhere; margin-top: 2px; }
.tc-trans.err { font: 400 17px/1.35 var(--font); color: var(--label2); letter-spacing: -.01em; }
.tc-meta { color: var(--label2); font-size: 15px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.tc-meta .ipa { font-family: var(--font); }
.tc-actions { display: flex; align-items: center; gap: 4px; margin-top: 14px; margin-left: -8px; }
.act { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--accent); }
.act.on { color: var(--accent); }
.act .ic { width: 25px; height: 25px; }
.play { margin-left: auto; width: 40px; height: 40px; border-radius: 20px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.play .ic { width: 20px; height: 20px; }
.dots { display: inline-flex; gap: 6px; padding: 12px 0 6px; }
.dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); opacity: .3; animation: pulse 1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }

.status-line { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--label2); margin: 10px 4px 0; min-height: 20px; }
.status-line .ic { width: 16px; height: 16px; }
.status-line.ok { color: var(--green); }
.status-line.warn { color: var(--orange); }

.mic-wrap { display: flex; justify-content: center; margin-top: 18px; }
.mic { width: 64px; height: 64px; border-radius: 32px; background: var(--card); color: var(--accent); display: grid; place-items: center; box-shadow: var(--shadow); }
.mic.live { background: var(--red); color: var(--on-accent); animation: pulse 1.2s infinite; }
.mic .ic { width: 28px; height: 28px; }

.ctx-toggle { display: flex; align-items: center; gap: 8px; color: var(--accent); font-size: 15px; height: 40px; margin: 6px 2px 0; }
.ctx-toggle .ic { width: 18px; height: 18px; }
.ctx-box { background: var(--card); border-radius: 14px; padding: 10px 14px 12px; margin-top: 6px; }
.ctx-box label { display: block; font-size: 13px; color: var(--label2); margin-bottom: 4px; }
.ctx-box textarea { width: 100%; box-sizing: border-box; border: 0; outline: 0; background: transparent; resize: none; font: italic 17px/1.35 var(--serif); color: var(--label); padding: 0; min-height: 48px; }

/* grouped lists */
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 4px 8px; }
.sec-h h2 { font: 700 22px/1.2 var(--font); margin: 0; letter-spacing: -.01em; }
.sec-h .link { color: var(--accent); font-size: 15px; }
.list-h { font-size: 13px; color: var(--label2); text-transform: uppercase; letter-spacing: .03em; margin: 24px 16px 7px; }
.list-f { font-size: 13px; color: var(--label2); margin: 7px 16px 0; line-height: 1.38; }
.list { background: var(--card); border-radius: 12px; overflow: hidden; }
.sheet .list, .sheet .card { background: var(--sheet-card); }
.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 16px; box-sizing: border-box; width: 100%; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.row.ind + .row.ind::before { left: 56px; }
button.row:active, label.row:active { background: var(--fill); }
.row .main { flex: 1; min-width: 0; }
.row .t1 { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t1 b { font-weight: 600; }
.row .t2 { font-size: 15px; color: var(--label2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.row .val { color: var(--label2); font-size: 17px; flex: none; font-variant-numeric: tabular-nums; }
.row .chev { color: var(--label3); width: 14px; height: 14px; flex: none; }
.row .lead { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--on-accent); flex: none; }
.row .lead .ic { width: 18px; height: 18px; }
.row.danger { color: var(--red); justify-content: center; }
.row.action { color: var(--accent); }
.star-mini { color: var(--accent); width: 34px; height: 34px; display: grid; place-items: center; flex: none; margin-right: -8px; }
.star-mini .ic { width: 22px; height: 22px; }

.dict { background: var(--card); border-radius: 16px; padding: 4px 18px 16px; margin-top: 12px; }
.dict h3 { font-size: 13px; color: var(--label2); text-transform: uppercase; letter-spacing: .03em; margin: 14px 0 4px; font-weight: 600; }
.dict p { margin: 0; line-height: 1.4; }
.dict .terms { font-size: 17px; }
.dict .def { font-size: 16px; }
.dict .ex { font: italic 17px/1.4 var(--serif); margin-top: 2px; }
.dict .exde { color: var(--label2); font-size: 15px; margin-top: 3px; }
.dict .note { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 15px; line-height: 1.38; }
.dict .src-note { margin-top: 14px; font-size: 12px; color: var(--label3); }

.tapwords { background: var(--card); border-radius: 16px; padding: 12px 14px 14px; margin-top: 12px; }
.tapwords .hint { font-size: 13px; color: var(--label2); margin: 0 4px 8px; }
.tapwords .flow { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 34px; padding: 0 12px; border-radius: 17px; background: var(--fill); font-size: 16px; }
.chip.k { background: var(--accent-soft); color: var(--accent); }

.empty { text-align: center; color: var(--label2); padding: 36px 24px; font-size: 15px; line-height: 1.4; }
.empty .big { width: 56px; height: 56px; margin: 0 auto 12px; color: var(--label3); }
.empty h3 { color: var(--label); font-size: 20px; margin: 0 0 6px; font-weight: 600; }

/* ---------- reader (camera tab) ---------- */
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-row.one { grid-template-columns: 1fr; }
.tile { position: relative; background: var(--card); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; min-height: 96px; box-sizing: border-box; text-align: left; box-shadow: var(--shadow); cursor: pointer; }
.tile .ic { width: 30px; height: 30px; color: var(--accent); }
.tile b { font-size: 16px; font-weight: 600; }
.tile small { display: block; color: var(--label2); font-size: 13px; margin-top: 2px; font-weight: 400; }
.tile input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.page-edit { background: var(--card); border-radius: 16px; padding: 12px 14px; margin-top: 12px; }
.page-edit textarea { width: 100%; box-sizing: border-box; min-height: 220px; border: 0; outline: 0; resize: vertical; background: transparent; font: 18px/1.5 var(--serif); color: var(--label); padding: 0; }
.page-edit .bar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.reader { background: var(--card); border-radius: 16px; padding: 18px 18px 8px; margin-top: 12px; font: 19px/1.62 var(--serif); letter-spacing: 0; overflow-wrap: break-word; }
.reader p { margin: 0 0 14px; }
.reader .w { border-radius: 4px; cursor: pointer; padding: 0 1px; margin: 0 -1px; transition: background .15s; }
.reader .w:active, .reader .w.sel { background: var(--hl); }
.reader .w.k { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.reader-bar { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin: 20px 4px 0; color: var(--label2); font-size: 13px; }
.reader-bar .links { display: flex; gap: 16px; }
.reader-bar button { color: var(--accent); font-size: 15px; }
.legend { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 18px; border-bottom: 2px solid var(--accent); }

/* ---------- practice tab ---------- */
.hero-card { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); }
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hero-num { font: 700 56px/1 var(--rounded); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.hero-lbl { color: var(--label2); font-size: 15px; margin-top: 4px; }
.streak { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px 6px 8px; border-radius: 16px; background: var(--orange-soft); color: var(--orange); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.streak .ic { width: 18px; height: 18px; }
.streak.off { background: var(--fill); color: var(--label2); }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.stat { border-radius: 12px; padding: 10px 12px; background: var(--fill); }
.stat b { display: block; font: 600 22px/1.1 var(--rounded); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--label2); }
.stat.blue b { color: var(--accent); } .stat.orange b { color: var(--orange); } .stat.green b { color: var(--green); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; border-radius: 14px; font-size: 17px; font-weight: 600; box-sizing: border-box; padding: 0 16px; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.tinted { background: var(--accent-soft); color: var(--accent); }
.btn.gray { background: var(--fill); color: var(--label); }
.btn + .btn { margin-top: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { height: 30px; border-radius: 7px; font-size: 13px; font-weight: 500; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { background: var(--seg-on); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04); }
.opt-card { background: var(--card); border-radius: 14px; padding: 14px 16px; }
.opt-card + .opt-card { margin-top: 10px; }
.opt-card .lbl { font-size: 13px; color: var(--label2); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 92px; margin-top: 6px; }
.week .bar { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.week .bar i { display: block; width: 100%; max-width: 28px; border-radius: 6px 6px 3px 3px; background: var(--fill2); min-height: 4px; }
.week .bar.today i { background: var(--accent); }
.week .bar span { font-size: 11px; color: var(--label2); }
.week .bar em { font-style: normal; font-size: 11px; color: var(--label2); font-variant-numeric: tabular-nums; min-height: 13px; }

/* ---------- vocab tab ---------- */
.search { display: flex; align-items: center; gap: 6px; height: 36px; border-radius: 10px; background: var(--fill); padding: 0 8px; color: var(--label2); margin: 4px 0 12px; }
.search .ic { width: 18px; height: 18px; flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 17px; color: var(--label); }
.search input::placeholder { color: var(--label2); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 4px; padding: 0 16px 4px; }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; height: 32px; padding: 0 14px; border-radius: 16px; background: var(--card); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.fchip span { color: var(--label2); font-weight: 400; }
.fchip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.fchip[aria-pressed="true"] span { color: var(--on-accent); opacity: .8; }
.dot { width: 8px; height: 8px; border-radius: 4px; flex: none; }
.dot.new { background: var(--accent); } .dot.learning { background: var(--orange); } .dot.mastered { background: var(--green); }
.due-tag { font-size: 13px; color: var(--label2); flex: none; font-variant-numeric: tabular-nums; }
.due-tag.now { color: var(--red); font-weight: 500; }

/* ---------- sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; }
.sheet-dim { position: absolute; inset: 0; background: var(--dim); opacity: 0; transition: opacity .3s; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 640px;
  max-height: calc(100% - env(safe-area-inset-top, 0px) - 12px); height: auto;
  background: var(--sheet); border-radius: 12px 12px 0 0; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .38s cubic-bezier(.32, .72, 0, 1);
  box-shadow: 0 -2px 20px rgba(0, 0, 0, .12);
  --card: var(--sheet-card);
}
.sheet.tall { height: calc(100% - env(safe-area-inset-top, 0px) - 12px); }
.sheet-wrap.open .sheet-dim { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--fill2); margin: 6px auto 0; flex: none; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 46px; padding: 0 8px; flex: none; }
.sheet-head h2 { font-size: 17px; font-weight: 600; margin: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.sheet-head .l { justify-self: start; } .sheet-head .r { justify-self: end; font-weight: 600; }
.sheet-body {
  overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; overscroll-behavior: contain;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px calc(28px + env(safe-area-inset-bottom, 0px));
}
.word-head { display: flex; align-items: flex-start; gap: 10px; margin: 4px 2px 0; }
.word-head .w { flex: 1; min-width: 0; }
.word-head h3 { font: 700 30px/1.15 var(--font); margin: 0; letter-spacing: -.01em; overflow-wrap: anywhere; }
.word-head .ipa { color: var(--label2); font-size: 16px; margin-top: 4px; }
.word-trans { font: 600 24px/1.25 var(--font); color: var(--accent); margin: 14px 2px 0; overflow-wrap: anywhere; }
.ctx-quote { font: italic 17px/1.45 var(--serif); margin: 0; }
.ctx-quote mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 2px; }
.card { background: var(--card); border-radius: 12px; padding: 12px 16px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv div { background: var(--fill); border-radius: 10px; padding: 8px 10px; }
.kv b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.kv span { font-size: 12px; color: var(--label2); }
.field { display: block; padding: 10px 16px; position: relative; }
.field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.field span { display: block; font-size: 13px; color: var(--label2); margin-bottom: 2px; }
.field input, .field textarea { width: 100%; box-sizing: border-box; border: 0; outline: 0; background: transparent; font-size: 17px; padding: 2px 0; color: var(--label); resize: none; }
.field textarea { min-height: 44px; }
.confirm { background: var(--red-soft); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
.confirm p { margin: 0 0 12px; font-size: 15px; }
.confirm .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.confirm .btn { height: 44px; margin: 0; }
.btn.red { background: var(--red); color: var(--on-accent); }
.switch { -webkit-appearance: none; appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill2); position: relative; flex: none; margin: 0; cursor: pointer; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: var(--knob); box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16); transition: transform .2s; }
.switch:checked { background: var(--green); }
.switch:checked::after { transform: translateX(20px); }
.stepper { display: inline-flex; background: var(--fill); border-radius: 8px; flex: none; }
.stepper button { width: 46px; height: 32px; display: grid; place-items: center; font-size: 20px; color: var(--label); }
.stepper button + button { border-left: .5px solid var(--sep); }
.help { font-size: 15px; line-height: 1.45; }
.help ol { margin: 6px 0 0; padding-left: 20px; }
.help li + li { margin-top: 6px; }
.help code { font-size: 13px; background: var(--fill); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }

/* ---------- practice session ---------- */
.session {
  position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
}
.ses-inner { width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; }
.ses-top { display: flex; align-items: center; gap: 12px; height: 52px; flex: none; }
.ses-x { width: 32px; height: 32px; border-radius: 16px; background: var(--fill); color: var(--label2); display: grid; place-items: center; flex: none; }
.ses-x .ic { width: 16px; height: 16px; }
.progress { flex: 1; height: 6px; border-radius: 3px; background: var(--fill2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.ses-count { font-size: 15px; color: var(--label2); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.ses-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 8px 0 12px; }
.fcard { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 22px 20px; display: flex; flex-direction: column; flex: 1; min-height: 300px; box-sizing: border-box; }
.fcard .lang { font-size: 13px; font-weight: 600; color: var(--label2); display: flex; align-items: center; justify-content: space-between; min-height: 30px; }
.fcard .lang.accent { color: var(--accent); }
.fcard .front { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; padding: 18px 0; }
.fcard .q { font: 700 36px/1.15 var(--font); letter-spacing: -.02em; overflow-wrap: anywhere; }
.fcard .q.accent { color: var(--accent); }
.fcard .ipa { color: var(--label2); font-size: 16px; }
.fcard .ctxl { font: italic 16px/1.45 var(--serif); color: var(--label2); max-width: 32em; }
.fcard .ctxl mark { background: var(--hl); color: var(--label); border-radius: 3px; padding: 0 2px; }
.fcard .back { border-top: .5px solid var(--sep); padding-top: 16px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
.fcard .a { font: 600 28px/1.2 var(--font); color: var(--accent); overflow-wrap: anywhere; }
.fcard .alts { color: var(--label2); font-size: 15px; }
.fcard .exs { font: italic 16px/1.4 var(--serif); color: var(--label); }
.fcard .tag { align-self: center; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.fcard .tag.orange { background: var(--orange-soft); color: var(--orange); }
.ses-foot { flex: none; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades.two { grid-template-columns: 1fr 1fr; }
.grade { height: 62px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 600; font-size: 15px; }
.grade small { font-weight: 400; font-size: 12px; opacity: .85; font-variant-numeric: tabular-nums; }
.grade.g1 { background: var(--red-soft); color: var(--red); }
.grade.g2 { background: var(--orange-soft); color: var(--orange); }
.grade.g3 { background: var(--green-soft); color: var(--green); }
.grade.g4 { background: var(--accent-soft); color: var(--accent); }
.type-in { width: 100%; box-sizing: border-box; height: 54px; border-radius: 14px; border: 2px solid transparent; background: var(--fill); padding: 0 16px; font-size: 20px; outline: 0; color: var(--label); text-align: center; }
.type-in:focus { border-color: var(--accent); }
.type-in.right { border-color: var(--green); background: var(--green-soft); }
.type-in.close { border-color: var(--orange); background: var(--orange-soft); }
.type-in.wrong { border-color: var(--red); background: var(--red-soft); }
.verdict { font-size: 15px; font-weight: 600; text-align: center; margin: 10px 0 0; min-height: 20px; }
.verdict.right { color: var(--green); } .verdict.close { color: var(--orange); } .verdict.wrong { color: var(--red); }
.choices { display: grid; gap: 10px; margin-top: 14px; }
.choice { min-height: 56px; border-radius: 14px; background: var(--card); padding: 10px 16px; font-size: 18px; font-weight: 500; text-align: center; box-shadow: var(--shadow); overflow-wrap: anywhere; transition: background .15s, color .15s; }
.choice.right { background: var(--green); color: var(--on-accent); }
.choice.wrong { background: var(--red); color: var(--on-accent); }
.done { text-align: center; padding: 40px 12px 20px; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; }
.done .ring { width: 88px; height: 88px; border-radius: 44px; background: var(--green-soft); color: var(--green); display: grid; place-items: center; }
.done .ring .ic { width: 48px; height: 48px; }
.done h2 { font-size: 28px; margin: 8px 0 0; }
.done p { color: var(--label2); margin: 0; font-size: 16px; line-height: 1.4; }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); z-index: 60; background: var(--hud); color: var(--on-hud); padding: 10px 16px; border-radius: 22px; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 48px); box-sizing: border-box; opacity: 0; transition: opacity .2s, transform .25s; pointer-events: none; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast .ic { width: 18px; height: 18px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (min-width: 700px) {
  .view { padding-top: 12px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- ÜBERSETZEN -->
  <main class="view" id="v-translate" aria-label="Übersetzen">
    <div class="nav-row">
      <span></span>
      <button class="nav-btn right" data-act="settings" aria-label="Einstellungen"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="7.9" cy="12" r="1.35" fill="currentColor"/><circle cx="12" cy="12" r="1.35" fill="currentColor"/><circle cx="16.1" cy="12" r="1.35" fill="currentColor"/></svg></button>
    </div>
    <div class="lang-bar">
      <button class="lang-btn" id="lang-from" data-act="swap">Englisch</button>
      <button class="swap-btn" id="swap-btn" data-act="swap" aria-label="Sprachen tauschen"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h15M15.5 4.5l4 4-4 4M20 15.5H5M8.5 11.5l-4 4 4 4"/></svg></button>
      <button class="lang-btn" id="lang-to" data-act="swap">Deutsch</button>
    </div>

    <section class="tcard" id="tcard">
      <div class="tc-sec tc-src">
        <div class="tc-lang">
          <span id="src-lang">Englisch</span>
          <span class="grow"></span>
          <button class="mini-btn accent" id="speak-src" data-act="speak-src" aria-label="Vorlesen" hidden></button>
          <button class="mini-btn" id="clear-btn" data-act="clear" aria-label="Text löschen" hidden></button>
        </div>
        <label for="src" class="vh">Text zum Übersetzen</label>
        <textarea id="src" rows="1" placeholder="Text eingeben" enterkeyhint="go" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
        <div class="tc-tools" id="src-tools">
          <button class="pill" id="paste-btn" data-act="paste" hidden></button>
          <button class="go-btn" id="go-btn" data-act="go" aria-label="Übersetzen" hidden></button>
        </div>
      </div>

      </div>
    </section>
    <div class="status-line" id="save-line" hidden></div>
    <div class="mic-wrap" id="mic-wrap" hidden><button class="mic" id="mic-btn" data-act="mic" aria-label="Sprechen"></button></div>

    <button class="ctx-toggle" id="ctx-toggle" data-act="ctx-toggle"></button>
    <div class="ctx-box" id="ctx-box" hidden>
      <label for="ctx">Satz aus dem Buch – hilft, die passende Bedeutung zu finden</label>
      <textarea id="ctx" rows="2" placeholder="z. B. „She was reluctant to leave the house.“" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

  </main>

  <!-- KAMERA / BUCHSEITE -->
  <main class="view" id="v-camera" aria-label="Buchseite" hidden>
    <div class="nav-row"></div>

    <div class="btn-row" id="cam-actions">
      <label class="tile" id="photo-tile" hidden>
        <span id="photo-ic"></span>
        <span><b>Seite fotografieren</b><small>Text wird erkannt</small></span>

      </label>

      <label for="page-text" class="vh">Text der Buchseite</label>
      <textarea id="page-text" placeholder="Text hier einfügen …" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="bar"><button class="pill" data-act="page-cancel">Abbrechen</button><button class="pill" data-act="page-save" style="background:var(--accent);color:var(--on-accent)">Fertig</button></div>

<script>
'use strict';
(() => {
/* =====================================================================
   Basics
   ===================================================================== */
const MIN = 6e4, HOUR = 36e5, DAY = 864e5;
const now = () => Date.now();
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const mkId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const LANG = { en: { name: 'Englisch' }, de: { name: 'Deutsch' } };
const POS_DE = {
  noun: 'Substantiv', verb: 'Verb', adjective: 'Adjektiv', adverb: 'Adverb', preposition: 'Präposition',
  conjunction: 'Konjunktion', pronoun: 'Pronomen', interjection: 'Interjektion', phrase: 'Redewendung',
  abbreviation: 'Abkürzung', article: 'Artikel', prefix: 'Präfix', suffix: 'Suffix', 'auxiliary verb': 'Hilfsverb', particle: 'Partikel'
};
const posDe = p => POS_DE[String(p || '').toLowerCase()] || p || '';

function norm(s) {
  return String(s || '').replace(/\s+/g, ' ').trim()
    .replace(/^[\s"'“”‘’«»„‚(\[{.,;:!?¿¡…–—-]+/, '')
    .replace(/[\s"'“”‘’«»„‚)\]}.,;:!?…–—-]+$/, '');
}
const keyOf = s => norm(s).toLowerCase().replace(/[’‘]/g, "'");
const wordCount = s => norm(s).split(' ').filter(Boolean).length;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } }
};
// A learning day starts at 4:00, like Anki, so late-night reading still counts for "today".
function dayKey(t = now()) { const d = new Date(t - 4 * HOUR); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dayStart(t = now()) { const d = new Date(t - 4 * HOUR); d.setHours(4, 0, 0, 0); return d.getTime(); }
function fmtIvl(ms) {
  if (ms < HOUR) return Math.max(1, Math.round(ms / MIN)) + ' Min';
  if (ms < DAY) return Math.round(ms / HOUR) + ' Std';
  const d = Math.round(ms / DAY);
  if (d < 31) return d + ' T';
  if (d < 365) return String(Math.round(d / 30.4 * 10) / 10).replace('.', ',') + ' Mon';
  return String(Math.round(d / 365 * 10) / 10).replace('.', ',') + ' J';
}
function fmtDue(w) {
  const s = w.srs;
  if (!s || s.state === 'new') return '';
  const t = now();
  if (s.due <= t) return 'fällig';
  if (s.state !== 'review') return 'in ' + fmtIvl(s.due - t);
  const days = Math.round((dayStart(s.due) - dayStart(t)) / DAY);
  if (days <= 0) return 'heute';
  if (days === 1) return 'morgen';
  return 'in ' + fmtIvl(days * DAY);
}

/* =====================================================================
   Icons (SF-Symbols-like, drawn inline)
   ===================================================================== */
const sv = (body, vb = '0 0 24 24') => `<svg class="ic" viewBox="${vb}" aria-hidden="true">${body}</svg>`;
const ST = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
const STAR = 'M12 3.1l2.7 5.5 6.05.88-4.38 4.27 1.03 6.03L12 16.93l-5.4 2.85 1.03-6.03L3.25 9.48l6.05-.88z';
const I = {
  star: sv(`<path d="${STAR}" ${ST} stroke-width="1.7"/>`),
  starFill: sv(`<path d="${STAR}" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>`),
  speaker: sv(`<path d="M3.5 9.2h3.3L11.5 5v14l-4.7-4.2H3.5z" fill="currentColor"/><path d="M15 9.2a4 4 0 010 5.6M17.6 6.6a7.6 7.6 0 010 10.8" ${ST}/>`),

/* =====================================================================
   Spaced repetition (SM-2 variant with learning steps, like Anki)
   ===================================================================== */
const LEARN_STEPS = [1 * MIN, 10 * MIN];
const RELEARN_STEPS = [10 * MIN];
const LEARN_AHEAD = 20 * MIN;
const newSrs = () => ({ state: 'new', due: 0, ivl: 0, ease: 2.5, reps: 0, lapses: 0, step: 0, last: 0 });

function nextSrs(prev, g, t = now(), fuzz = true) {
  const s = { ...newSrs(), ...(prev || {}) };
  s.reps++; s.last = t;
  const fz = d => (!fuzz || d < 3) ? d : Math.max(1, Math.round(d * (0.95 + Math.random() * 0.1)));
  const reviewAt = d => dayStart(t) + d * DAY;
  if (s.state !== 'review') {
    const relearn = s.state === 'relearning';
    const steps = relearn ? RELEARN_STEPS : LEARN_STEPS;
    if (s.state === 'new') { s.state = 'learning'; s.step = 0; }
    if (g === 1) { s.step = 0; s.due = t + steps[0]; return s; }
    if (g === 2) { s.due = t + (s.step === 0 && steps.length > 1 ? (steps[0] + steps[1]) / 2 : steps[Math.min(s.step, steps.length - 1)]); return s; }
    if (g === 3 && s.step + 1 < steps.length) { s.step++; s.due = t + steps[s.step]; return s; }
    s.ivl = relearn ? Math.max(1, s.ivl) + (g === 4 ? 1 : 0) : (g === 4 ? 4 : 1);
    s.state = 'review'; s.step = 0; s.due = reviewAt(s.ivl);
    return s;
  }
  if (g === 1) {
    s.lapses++; s.ease = Math.max(1.3, s.ease - 0.2);
    s.ivl = Math.max(1, Math.round(s.ivl * 0.5));
    s.state = 'relearning'; s.step = 0; s.due = t + RELEARN_STEPS[0];
    return s;
  }
  const over = Math.max(0, (dayStart(t) - dayStart(s.due || t)) / DAY);
  const hard = Math.max(s.ivl + 1, Math.round(s.ivl * 1.2));
  const good = Math.max(hard + 1, Math.round((s.ivl + over / 2) * s.ease));
  const easy = Math.max(good + 1, Math.round((s.ivl + over) * s.ease * 1.3));
  const ivl = Math.min(3650, fz(g === 2 ? hard : g === 3 ? good : easy));
  if (g === 2) s.ease = Math.max(1.3, s.ease - 0.15);
  if (g === 4) s.ease += 0.15;
  s.ivl = ivl; s.due = reviewAt(ivl);
  return s;
}

  const t = now();

}

  if (!id) return;

    if (sg.exists) {

/* ---------- session ---------- */
let SES = null;
function startSession(free = false) {
  const mode = S.settings.mode === 'mc' && S.words.length < 4 ? 'flash' : S.settings.mode;
  SES = { free, mode, done: 0, ok: 0, lastId: null, cur: null, newLeft: counts().newAvail, phase: 'q', pool: null, startedAt: now() };
  if (free) {
    // weakest first: many lapses, short intervals, then random
    const ws = [...S.words].sort((a, b) => ((b.srs?.lapses || 0) - (a.srs?.lapses || 0)) || ((a.srs?.ivl || 0) - (b.srs?.ivl || 0)) || (Math.random() - .5));
    SES.pool = ws.slice(0, 20).sort(() => Math.random() - .5);
    SES.total = SES.pool.length;
  }
  $('#session').hidden = false;
  document.body.classList.add('locked');
  nextCard();
}
function endSession() {
  SES = null;
  $('#session').hidden = true; $('#session').innerHTML = '';
  if (!sheets.length) document.body.classList.remove('locked');
  renderAll();
}
function pickNext() {
  const t = now();
  if (SES.free) return SES.pool.shift() || null;
  const notLast = arr => arr.length > 1 ? arr.filter(w => w.id !== SES.lastId) : arr;
  const learnDue = S.words.filter(w => ['learning', 'relearning'].includes(stateOf(w)) && w.srs.due <= t).sort((a, b) => a.srs.due - b.srs.due);
  const revDue = S.words.filter(w => stateOf(w) === 'review' && w.srs.due <= t).sort((a, b) => a.srs.due - b.srs.due);
  const nw = SES.newLeft > 0 ? S.words.filter(w => stateOf(w) === 'new').sort((a, b) => (a.created || 0) - (b.created || 0)) : [];
  // interleave: due learning first, then reviews and new cards mixed
  if (learnDue.length && (learnDue[0].id !== SES.lastId || (!revDue.length && !nw.length))) return learnDue[0];
  if (revDue.length && nw.length) return (SES.done % 3 === 2 ? nw[0] : notLast(revDue)[0]);
  if (revDue.length) return notLast(revDue)[0];
  if (nw.length) return nw[0];
  if (learnDue.length) return learnDue[0];
  const ahead = S.words.filter(w => ['learning', 'relearning'].includes(stateOf(w)) && w.srs.due <= t + LEARN_AHEAD).sort((a, b) => a.srs.due - b.srs.due);
  return notLast(ahead)[0] || null;
}
function remaining() {
  if (SES.free) return SES.pool.length + (SES.cur ? 1 : 0);
  const t = now();
  const lr = S.words.filter(w => ['learning', 'relearning'].includes(stateOf(w)) && w.srs.due <= t + LEARN_AHEAD).length;
  const rv = S.words.filter(w => stateOf(w) === 'review' && w.srs.due <= t).length;
  const nw = Math.min(SES.newLeft, S.words.filter(w => stateOf(w) === 'new').length);
  return lr + rv + nw;
}
function nextCard() {
  const w = pickNext();
  SES.cur = w; SES.phase = 'q'; SES.typed = ''; SES.verdict = null; SES.choice = null;
  if (!w) return renderDone();
  const dir = S.settings.pdir === 'mix' ? (Math.random() < .5 ? 'en-de' : 'de-en') : S.settings.pdir;
  SES.dir = SES.mode === 'type' ? 'de-en' : dir;
  if (SES.mode === 'mc') SES.options = mcOptions(w, SES.dir);

}
function mcOptions(w, dir) {
  const field = dir === 'en-de' ? 'de' : 'en';
  const right = w[field];
  const others = S.words.filter(x => x.id !== w.id && keyOf(x[field]) !== keyOf(right));
  const uniq = []; const seen = new Set([keyOf(right)]);
  for (const x of others.sort(() => Math.random() - .5)) { const k = keyOf(x[field]); if (!seen.has(k)) { seen.add(k); uniq.push(x[field]); } if (uniq.length === 3) break; }
  return [right, ...uniq].sort(() => Math.random() - .5);
}

function typeCheck() {
  const inp = $('#type-in'); if (!inp || SES.verdict) return;
  const typed = keyOf(inp.value).replace(/^(to|the|a|an)\s+/, '').trim();
  SES.typed = inp.value;
  if (!typed) return;
  const forms = answerForms(SES.cur);
  let best = Infinity, len = 1;
  for (const f of forms) { const d = lev(typed, f); if (d < best) { best = d; len = f.length; } }
  SES.verdict = best === 0 ? 'right' : (best === 1 && len >= 4) || (best === 2 && len >= 9) ? 'close' : 'wrong';
  if (SES.verdict === 'right') speak(SES.cur.en, 'en');
  renderSession();
}
function applyGrade(g) {
  const w = SES.cur; if (!w) return;
  const st0 = stateOf(w);
  if (!SES.free) {
    w.srs = nextSrs(w.srs, g);
    if (st0 === 'new') { SES.newLeft--; today().nw++; }
    today().rev++; if (g >= 3) today().ok++;
    saveWord(w);
    saveStats();
  } else { today().rev++; if (g >= 3) today().ok++; saveStats(); }
  SES.done++; if (g >= 3) SES.ok++;
  SES.lastId = w.id;
  nextCard();
}
function renderDone() {
  const el = $('#session');
  const c = counts();
  const pct = SES.done ? Math.round(SES.ok / SES.done * 100) : 0;
  const t = now();
  const tomorrow = S.words.filter(w => stateOf(w) === 'review' && dayStart(w.srs.due) === dayStart(t) + DAY).length;
  el.innerHTML = `<div class="ses-inner"><div class="ses-top"><button class="ses-x" data-act="ses-close" aria-label="Schließen">${I.x}</button><div class="progress"><i style="width:100%"></i></div><span class="ses-count">${SES.done}/${SES.done}</span></div>
    <div class="done"><div class="ring">${I.check}</div><h2>${SES.done ? 'Geschafft!' : 'Gerade nichts fällig'}</h2>
      <p>${SES.done ? `${SES.done} ${SES.done === 1 ? 'Karte' : 'Karten'} · ${pct} % gewusst` : 'Komm später wieder oder übe frei.'}</p>
      <p>${c.soon ? `${c.soon} ${c.soon === 1 ? 'Karte kommt' : 'Karten kommen'} in ein paar Minuten noch einmal.` : tomorrow ? `Morgen ${tomorrow === 1 ? 'ist 1 Karte' : `sind ${tomorrow} Karten`} dran.` : ''}</p>
      <p>${streak() ? `${I.flame.replace('class="ic"', 'class="ic ic-s" style="display:inline-block;vertical-align:-3px;color:var(--orange)"')} ${streak()} ${streak() === 1 ? 'Tag' : 'Tage'} in Folge` : ''}</p>

}

function renderVocab() {
  const c = counts();
  const t = now();
  const filters = [['all', 'Alle', c.total], ['due', 'Fällig', c.due], ['new', 'Neu', c.nw], ['learning', 'Am Lernen', c.learning], ['mastered', 'Gefestigt', c.mastered]];
  $('#filter-chips').innerHTML = filters.map(([k, l, n]) => `<button class="fchip" data-act="filter" data-v="${k}" aria-pressed="${S.filter === k}">${l} <span>${n}</span></button>`).join('');
  const q = keyOf(S.query);
  let list = S.words.filter(w => {
    if (S.filter === 'due' && !isDue(w, t)) return false;
    if (['new', 'learning', 'mastered'].includes(S.filter) && statusOf(w) !== S.filter) return false;
    if (q && !(keyOf(w.en).includes(q) || keyOf(w.de).includes(q) || keyOf(w.ctx || '').includes(q))) return false;
    return true;
  }).sort((a, b) => (b.created || 0) - (a.created || 0));
  const wrap = $('#vocab-wrap');
  if (!S.words.length) {
    wrap.innerHTML = `<div class="empty"><div class="big">${I.starFill}</div><h3>Noch keine Vokabeln</h3>Jedes Wort, das du übersetzt, wird hier automatisch gespeichert – mit Aussprache, Beispielsatz und dem Satz aus deinem Buch.<div style="margin-top:18px"><button class="btn tinted" data-tab-go="translate">Erstes Wort übersetzen</button></div></div>`;
    return;
  }
  if (!list.length) { wrap.innerHTML = `<div class="empty">${q ? `Keine Treffer für „${esc(S.query)}“.` : 'In dieser Liste ist gerade nichts.'}</div>`; return; }
  const groups = [];
  const d0 = dayStart(t);
  const label = ts => {
    const d = dayStart(ts);
    if (d >= d0) return 'Heute';
    if (d >= d0 - DAY) return 'Gestern';
    if (d >= d0 - 6 * DAY) return 'Letzte 7 Tage';
    return new Date(ts).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
  };
  for (const w of list) {
    const l = label(w.created || t);
    if (!groups.length || groups[groups.length - 1].l !== l) groups.push({ l, items: [] });
    groups[groups.length - 1].items.push(w);
  }
  const shown = groups.slice();
  wrap.innerHTML = shown.map(g => `<div class="list-h">${esc(g.l)}</div><div class="list">${g.items.map(w => {
    const st = statusOf(w), due = fmtDue(w);
    return `<button class="row" data-act="detail" data-id="${w.id}"><span class="dot ${st}" title="${STATUS_DE[st]}"></span><div class="main"><div class="t1"><b lang="en">${esc(w.en)}</b></div><div class="t2" lang="de">${esc(w.de)}</div></div>${due ? `<span class="due-tag${due === 'fällig' ? ' now' : ''}">${esc(due)}</span>` : ''}<span class="chev">${I.chev}</span></button>`;
  }).join('')}</div>`).join('') + `<p class="list-f" style="text-align:center;margin-top:18px">${list.length} ${list.length === 1 ? 'Vokabel' : 'Vokabeln'}</p>`;
}

async function saveFile(filename, data, mime) {
  await CAP.ready;
  if (CAP.downloads) {
    try { await CAP.downloads.save({ filename, data }); toast('Gespeichert', 'check'); return; }
    catch (e) { if (e && e.code === 'declined') return; if (e && e.code !== 'unavailable' && e.code !== 'not_granted') { toast('Speichern nicht möglich'); return; } }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch { toast('Speichern ist hier nicht möglich'); }
}
function exportData(kind) {
  if (!S.words.length) { toast('Noch keine Vokabeln zum Exportieren'); return; }
  const stamp = dayKey();
  if (kind === 'json') {
    saveFile(`vokabeln-${stamp}.json`, JSON.stringify({ app: 'vokabel-uebersetzer', version: 1, exported: new Date().toISOString(), words: S.words.map(clean), stats: S.stats }, null, 1), 'application/json');
  } else {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const rows = [['Englisch', 'Deutsch', 'Aussprache', 'Satz aus dem Buch', 'Beispiel', 'Notiz', 'Gespeichert']].concat(
      S.words.map(w => [w.en, w.de, w.ipa, w.ctx, w.ex, w.note, new Date(w.created || now()).toISOString().slice(0, 10)]));
    saveFile(`vokabeln-${stamp}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
  }
}
function importFile(file, done) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(String(fr.result));
      const list = Array.isArray(data) ? data : data.words;
      if (!Array.isArray(list)) throw new Error('format');
      let added = 0, skipped = 0;
      for (const raw of list) {
        if (!raw || !raw.en || !raw.de) { skipped++; continue; }
        if (findByKey(keyOf(raw.en))) { skipped++; continue; }
        const w = { ...raw, id: raw.id && !findById(raw.id) ? String(raw.id) : mkId(), srs: { ...newSrs(), ...(raw.srs || {}) }, created: raw.created || now() };
        delete w._synced;
        saveWord(w, { touch: true }); added++;
      }
      if (data.stats && data.stats.days) { for (const [k, v] of Object.entries(data.stats.days)) if (!S.stats.days[k]) S.stats.days[k] = v; saveStats(); }
      toast(`${added} importiert${skipped ? `, ${skipped} übersprungen` : ''}`, 'check');
      renderAll(); done && done();
    } catch { toast('Diese Datei ist kein gültiges Backup'); }
  };
  fr.readAsText(file);
}

const scrollPos = {};
function showTab(tab) {
  if (S.tab === tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  scrollPos[S.tab] = window.scrollY;
  S.tab = tab;
  $$('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  $$('main.view').forEach(v => { v.hidden = v.id !== 'v-' + tab; });
  renderAll();
  window.scrollTo(0, scrollPos[tab] || 0);
  if (location.hash && /^#(uebersetzen|kamera|ueben|vokabeln)$/.test(location.hash)) { try { history.replaceState(null, '', '#' + TAB_HASH[tab]); } catch { /* ignore */ } }
}
const TAB_HASH = { translate: 'uebersetzen', camera: 'kamera', practice: 'ueben', vocab: 'vokabeln' };
function renderAll() {
  renderBadge();
  if (S.tab === 'translate') renderTranslate();
  else if (S.tab === 'camera') renderCamera();
  else if (S.tab === 'practice') renderPractice();
  else if (S.tab === 'vocab') renderVocab();
}

    case 'ctx-toggle': {
      const box = $('#ctx-box'); box.hidden = !box.hidden;
      if (!box.hidden) setTimeout(() => ctxEl.focus(), 30); else if (ctxEl.value) { ctxEl.value = ''; if (src.value.trim() && aiOn()) commit(); }
      renderTranslate(); break;
    }
    case 'lookup': openWordSheet(b.dataset.term, T.text); break;
    case 'open-recent': openRecent(b.dataset.id); break;
    case 'detail': openDetail(b.dataset.id); break;
    case 'say': speak(b.dataset.text, 'en'); break;
    case 'mic': toggleMic(); break;
    case 'add-word': showTab('translate'); if (S.settings.from !== 'en') swapLang(); src.value = ''; autosize(); resetResult(); setTimeout(() => src.focus(), 50); break;
    case 'filter': S.filter = b.dataset.v; renderVocab(); break;
    case 'mode': S.settings.mode = b.dataset.v; saveSettings(); renderPractice(); break;
    case 'pdir': S.settings.pdir = b.dataset.v; saveSettings(); renderPractice(); break;
    case 'start': startSession(false); break;
    case 'cram': startSession(true); break;
    case 'ses-close': endSession(); break;
    case 'ses-again': startSession(false); break;
    case 'reveal': if (SES && SES.phase === 'q') { SES.phase = 'a'; renderSession(); if (SES.dir === 'de-en' || S.settings.autoSpeak) speak(SES.cur.en, 'en'); } break;
    case 'grade': applyGrade(Number(b.dataset.g)); break;
    case 'type-check': typeCheck(); break;
    case 'type-skip': if (SES) { SES.verdict = 'wrong'; SES.typed = ''; renderSession(); speak(SES.cur.en, 'en'); } break;
    case 'type-next': if (SES) applyGrade(SES.verdict === 'right' ? 3 : SES.verdict === 'close' ? 2 : 1); break;
    case 'type-override': if (SES) applyGrade(3); break;
    case 'mc': {
      if (!SES || SES.choice != null) break;
      const i = Number(b.dataset.i); SES.choice = i;
      const rightV = SES.dir === 'en-de' ? SES.cur.de : SES.cur.en;
      const ok = keyOf(SES.options[i]) === keyOf(rightV);
      renderSession();
      if (ok) { speak(SES.cur.en, 'en'); setTimeout(() => { if (SES && SES.choice === i) applyGrade(3); }, 750); }
      break;
    }
    case 'mc-next': applyGrade(1); break;
    case 'page-edit': $('#page-edit').hidden = false; $('#page-text').value = R.text; $('#reader-wrap').hidden = true; $('#cam-actions').hidden = true; setTimeout(() => $('#page-text').focus(), 30); break;
    case 'page-cancel': $('#page-edit').hidden = true; $('#reader-wrap').hidden = false; $('#cam-actions').hidden = false; break;
    case 'page-save': R.text = $('#page-text').value; store.set('vt.page', R.text); $('#page-edit').hidden = true; $('#reader-wrap').hidden = false; $('#cam-actions').hidden = false; renderCamera(); break;
    case 'page-clear': R.text = ''; store.set('vt.page', ''); renderCamera(); break;
  }
});
// reader taps (spans, not buttons, so text keeps flowing like a book)
document.addEventListener('click', e => {
  const sp = e.target.closest('#reader .w'); if (!sp) return;
  const p = R.paras?.[Number(sp.dataset.p)] || '';
  $$('#reader .w.sel').forEach(x => x.classList.remove('sel'));
  sp.classList.add('sel');
  const o = Number(sp.dataset.o);
  const atStart = /(^|[.!?…:"“”‘’]\s*)$/.test(p.slice(0, o).trimEnd() + (o ? ' ' : ''));
  openWordSheet(sp.textContent, sentenceAt(p, o), atStart);
});

/* clipboard + microphone are only offered where the browser allows them (not inside the claude.ai frame) */
const canReadClipboard = !window.claude && !!(navigator.clipboard && navigator.clipboard.readText);
async function pasteClipboard() {
  try { const t = await navigator.clipboard.readText(); if (t && t.trim()) { src.value = t.trim(); autosize(); commit(); } }
  catch { toast('Einfügen nicht erlaubt – halte das Feld gedrückt und wähle „Einsetzen“'); src.focus(); }
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
function toggleMic() {
  if (!SR) return;
  if (recog) { try { recog.stop(); } catch { /* ignore */ } return; }
  try {
    recog = new SR();
    recog.lang = dirs().from === 'en' ? S.settings.accent : 'de-DE';
    recog.interimResults = true; recog.maxAlternatives = 1;
    recog.onresult = ev => { const r = [...ev.results].map(x => x[0].transcript).join(' '); src.value = r; autosize(); updateSrcTools(); if (ev.results[ev.results.length - 1].isFinal) commit(); };
    recog.onend = () => { recog = null; $('#mic-btn').classList.remove('live'); };
    recog.onerror = () => { recog = null; $('#mic-btn').classList.remove('live'); toast('Mikrofon nicht verfügbar'); };
    recog.start(); $('#mic-btn').classList.add('live');
  } catch { recog = null; toast('Spracheingabe nicht verfügbar'); }
}

function paintStaticIcons() {
  $$('[data-ic]').forEach(el => { el.outerHTML = I[el.dataset.ic]; });
  $('#clear-btn').innerHTML = I.xFill;
  $('#speak-src').innerHTML = I.speaker;
  $('#go-btn').innerHTML = I.arrowUp;
  $('#paste-btn').innerHTML = I.paste + '<span>Einfügen</span>';
  $('#mic-btn').innerHTML = I.mic;
  $('#add-btn').innerHTML = I.plus;
  $('#search-ic').outerHTML = I.search;
  $('#photo-ic').outerHTML = I.photo;
  $('#pastepage-ic').outerHTML = I.paste;
}

function handleIncoming() {
  // ?q=word (iOS Shortcut / Android share) or #q.word (artifact link anchor)
  let q = '';
  try {
    const u = new URL(location.href);
    q = u.searchParams.get('q') || u.searchParams.get('text') || '';
    if (!q) { const m = /^#q\.([\w.~-]+)$/.exec(location.hash); if (m) q = m[1].replace(/_/g, ' '); }
    if (q) { q = q.split(/\n|https?:\/\//)[0].trim().slice(0, 500); history.replaceState(null, '', location.pathname); }
    const m2 = /^#(uebersetzen|kamera|ueben|vokabeln)$/.exec(location.hash);
    if (m2) { const tab = Object.keys(TAB_HASH).find(k => TAB_HASH[k] === m2[1]); if (tab) showTab(tab); }
  } catch { /* ignore */ }
  if (q) { showTab('translate'); if (S.settings.from !== 'en') { S.settings.from = 'en'; applyLang(); } src.value = q; autosize(); commit(); }
}

function boot() {
  paintStaticIcons();
  applyLang();
  autosize();
  renderAll();
  $('#mic-wrap').hidden = !(SR && !window.claude);
  handleIncoming();
  CAP.ready.then(() => { T.live = !aiOn(); renderAll(); });
  connectCloud();
  if (navigator.storage && navigator.storage.persist && !window.claude) navigator.storage.persist().catch(() => {});
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { store.set('vt.words', S.words); store.set('vt.stats', S.stats); store.set('vt.settings', S.settings); }
    else renderAll();
  });
  // re-render once an hour so due counts stay right when the app stays open
  setInterval(() => { if (!SES && !sheets.length) renderBadge(); }, 60 * 1000);
}
boot();
})();
